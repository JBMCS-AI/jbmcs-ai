<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JBMCS AI - Diagnostics</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #f0f6fc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #161b22; border: 1px solid #30363d; padding: 2rem; border-radius: 8px; max-width: 550px; width: 90%; }
    h1 { color: #58a6ff; font-size: 1.4rem; margin-bottom: 0.2rem; text-align: center; }
    p { color: #8b949e; font-size: 0.85rem; text-align: center; margin-bottom: 1.5rem; }
    .status-box { background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 1rem; margin-top: 0.8rem; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-word; max-height: 250px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="card">
    <h1>JBMCS AI Diagnostics</h1>
    <p>Direct HTTP REST Test</p>
    <div id="app-status" class="status-box">Testing connection...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://dz1vczotqghsmszwlkh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6aXZjemV0cXFuaHNuc3p3bGtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MDg5OTgsImV4cCI6MjEwNDQ4NDk5OH0._nGYzlTCvSCUcdraeVIpQjygbhslNmwcYuoZUSkhXCI";

    async function testConnection() {
      const statusBox = document.getElementById('app-status');
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/product_categories?select=*&limit=1`, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();
        statusBox.style.color = '#3fb950';
        statusBox.innerHTML = `<strong>[REST API SUCCESS]</strong>\n\nData fetched successfully:\n${JSON.stringify(data, null, 2)}`;
      } catch (err) {
        statusBox.style.color = '#f85149';
        statusBox.innerHTML = `<strong>[FETCH FAILED]</strong>\n\n${err.message}\n\nNote: If using a mobile browser, check if a VPN, ad blocker, or strict tracking protection is blocking external requests.`;
      }
    }

    testConnection();
  </script>
</body>
</html>
