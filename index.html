<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JBMCS AI - Core Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #f0f6fc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #161b22; border: 1px solid #30363d; padding: 2rem; border-radius: 8px; max-width: 550px; width: 90%; }
    h1 { color: #58a6ff; font-size: 1.4rem; margin-bottom: 0.2rem; text-align: center; }
    p { color: #8b949e; font-size: 0.85rem; text-align: center; margin-bottom: 1.5rem; }
    .status-box { background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 1rem; margin-top: 0.8rem; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-word; max-height: 250px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="card">
    <h1>JBMCS AI Core Platform</h1>
    <p>JB ModCraft Studio - Live Engine Status</p>
    
    <div id="app-status" class="status-box">Connecting to Supabase...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://dz1vczotqghsmszwlkh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_OK20t15BXtHB1c88XwwWW_41sKA-D";

    async function initApp() {
      const statusBox = document.getElementById('app-status');
      try {
        if (!window.supabase) throw new Error("Supabase SDK script failed to load.");
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Test query to ai_prompt_context
        const { data, error } = await client
          .from('ai_prompt_context')
          .select('*')
          .limit(1);

        if (error) throw error;

        statusBox.style.color = '#3fb950';
        statusBox.innerHTML = `<strong>[SUCCESS: API Connected]</strong>\n\nDatabase query successful!\nRecords found: ${data.length}\n\nYour JBMCS AI Platform engine is live and operational.`;
      } catch (err) {
        statusBox.style.color = '#f85149';
        statusBox.innerHTML = `<strong>[CONNECTION ERROR]</strong>\n\n${err.message || JSON.stringify(err)}`;
      }
    }

    initApp();
  </script>
</body>
</html>
