<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JBMCS AI - Core Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #f0f6fc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #161b22; border: 1px solid #30363d; padding: 2rem; border-radius: 8px; max-width: 550px; width: 90%; }
    h1 { color: #58a6ff; font-size: 1.4rem; margin-bottom: 0.2rem; text-align: center; }
    p { color: #8b949e; font-size: 0.85rem; text-align: center; margin-bottom: 1.5rem; }
    .status-box { background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 1rem; margin-top: 0.8rem; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-word; max-height: 250px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="card">
    <h1>JBMCS AI Core Platform</h1>
    <p>Phase 6: Dynamic Knowledge Base Integration</p>
    
    <div id="prompt-status" class="status-box">Loading System Instructions...</div>
    <div id="data-status" class="status-box">Loading Manufacturing Knowledge Base...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://dz1vczotqghsmszwlkh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_OK20t15BXtHB1c88XwwWW_41sKA-D";

    async function loadEngineData() {
      const promptDiv = document.getElementById('prompt-status');
      const dataDiv = document.getElementById('data-status');

      try {
        if (!window.supabase) throw new Error("Supabase SDK failed to load.");
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // 1. Fetch System Prompt
        const { data: promptData, error: promptError } = await supabase
          .from('ai_prompt_context')
          .select('prompt_key, system_instruction')
          .eq('prompt_key', 'footwear_design_v1')
          .single();

        if (promptError) throw promptError;

        promptDiv.style.color = '#3fb950';
        promptDiv.innerHTML = `<strong>[Prompt Loaded]</strong>\nKey: ${promptData.prompt_key}\nInstruction: "${promptData.system_instruction}"`;

        // 2. Fetch Components & Categories Count
        const { count: compCount } = await supabase.from('footwear_components').select('*', { count: 'exact', head: true });
        const { count: catCount } = await supabase.from('product_categories').select('*', { count: 'exact', head: true });
        const { count: methodCount } = await supabase.from('construction_methods').select('*', { count: 'exact', head: true });

        dataDiv.style.color = '#3fb950';
        dataDiv.innerHTML = `<strong>[Knowledge Base Connected]</strong>\n- Product Categories: ${catCount} loaded\n- Footwear Components: ${compCount} loaded\n- Construction Methods: ${methodCount} loaded`;

      } catch (err) {
        promptDiv.style.color = '#f85149';
        promptDiv.innerHTML = `<strong>[Connection Error]</strong>\n${err.message || err}`;
      }
    }

    loadEngineData();
  </script>
</body>
</html>
